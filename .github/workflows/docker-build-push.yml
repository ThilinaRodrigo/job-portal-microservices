name: Build and push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
            dockerfile: auth-service/Dockerfile

          - name: job-service
            context: .
            dockerfile: job-service/Dockerfile

          - name: employee-service
            context: .
            dockerfile: employee-service/Dockerfile

          - name: employer-service
            context: .
            dockerfile: employer-service/Dockerfile

          - name: application-service
            context: .
            dockerfile: application-service/Dockerfile

          - name: gateway-server
            context: .
            dockerfile: gateway-server/Dockerfile

          - name: eureka-server
            context: .
            dockerfile: eureka-server/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest

