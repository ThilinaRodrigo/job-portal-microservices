server:
  port: 8084

spring:
  application:
    name: employee-service

  datasource:
    url: jdbc:postgresql://localhost:5432/employeedb
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

