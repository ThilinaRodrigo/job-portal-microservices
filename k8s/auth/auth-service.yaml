apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth
          image: thilinarodrigo/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://auth-db:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8070/eureka/

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: job-portal
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 8081


