apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: application
          image: thilinarodrigo/employee-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://employee-db:5432/employee_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8070/eureka/

---

apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: job-portal
spec:
  selector:
    app: employee-service
  ports:
    - port: 80
      targetPort: 8084


