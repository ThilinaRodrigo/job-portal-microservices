apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: thilinarodrigo/eureka-server:latest
          ports:
            - containerPort: 8070

---

apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: job-portal
spec:
  selector:
    app: eureka
  ports:
    - port: 8070
